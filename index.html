  <style>
:root {
  color-scheme: dark;
  --ink: #f8fafc;
  --muted: #dce5ed;
  --accent: #d8dce7;
  --button: rgba(255, 255, 255, .070);
  --line: rgba(255, 255, 255, .22);
  --panel-stroke: rgba(255, 255, 255, .27);
}
*, *::before, *::after { box-sizing: border-box; }
html { min-width: 280px; min-height: 100%; background: #405566; }
body {
  min-width: 280px;
  min-height: 100%;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: #405566;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
a { -webkit-tap-highlight-color: transparent; }
.scene {
  position: fixed;
  z-index: 0;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(ellipse 65% 45% at 72% -6%, rgba(228, 220, 210, .33), transparent 78%),
    radial-gradient(ellipse 72% 58% at -8% 94%, rgba(134, 149, 173, .36), transparent 72%),
    linear-gradient(165deg, #7a8596 0%, #56697b 43%, #425565 100%);
}
.scene::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
  opacity: .10;
  mix-blend-mode: soft-light;
}
.aurora { position: absolute; border-radius: 50%; filter: blur(85px); }
.aurora--mist { width: 48vw; height: 48vw; max-width: 560px; max-height: 560px; top: -19%; right: 6%; background: rgba(228, 215, 217, .28); }
.aurora--sky { width: 52vw; height: 50vw; max-width: 620px; max-height: 600px; bottom: -24%; left: -14%; background: rgba(128, 148, 174, .24); }
.aurora--pearl { width: 330px; height: 330px; bottom: 3%; right: -135px; background: rgba(222, 213, 205, .10); }
.score { position: absolute; width: min(68vw, 670px); color: #f2f6fa; opacity: .14; }
.score--left { left: -10%; top: 10%; transform: rotate(-17deg); }
.score--right { right: -15%; bottom: 6%; transform: rotate(17deg); }
.sparkle { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #f5f7fa; box-shadow: 0 0 20px 4px rgba(255, 255, 255, .18); opacity: .45; }
.sparkle--one { left: 12%; top: 29%; }
.sparkle--two { right: 20%; top: 18%; width: 3px; height: 3px; }
.sparkle--three { right: 10%; bottom: 24%; width: 4px; height: 4px; }
.page {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.profile {
  position: relative;
  isolation: isolate;
  width: min(100%, 490px);
  border: 1px solid var(--panel-stroke);
  border-radius: clamp(23px, 5vw, 35px);
  background: linear-gradient(158deg, rgba(107, 123, 140, .56) 0%, rgba(90, 106, 122, .71) 46%, rgba(72, 88, 105, .76) 100%);
  box-shadow: 0 24px 82px rgba(31, 43, 54, .25), inset 0 1px 0 rgba(255, 255, 255, .18);
  -webkit-backdrop-filter: blur(27px) saturate(118%);
  backdrop-filter: blur(27px) saturate(118%);
  overflow: hidden;
}
.profile::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: radial-gradient(ellipse 74% 40% at 48% 0%, rgba(240, 244, 249, .10), transparent 86%);
  pointer-events: none;
}
.profile__shine {
  position: absolute;
  top: 0;
  left: 14%;
  width: 72%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent);
}
.profile__motif {
  position: absolute;
  inset: 0;
  color: #f6fafc;
  opacity: .62;
  pointer-events: none;
}
.profile__motif svg {
  display: block;
  width: 100%;
  height: 100%;
}
.profile__body {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: clamp(17px, 3.5vh, 33px) clamp(14px, 4vw, 36px) clamp(20px, 3.4vh, 34px);
}
.portrait {
  position: relative;
  flex-shrink: 0;
  width: clamp(118px, 21vh, 184px);
  height: clamp(118px, 21vh, 184px);
  padding: 4px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f6f7fa 0%, #d9e2ed 45%, #b9c4d1 100%);
  box-shadow: 0 12px 36px rgba(31, 42, 52, .24), 0 0 0 6px rgba(255, 255, 255, .06);
}
.portrait::after {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .38);
  pointer-events: none;
}
.portrait img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; object-position: center 38%; }
.introduction { text-align: center; margin-top: clamp(12px, 2.2vh, 22px); max-width: 100%; }
h1, h2, p { margin: 0; }
h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(39px, 7.2vh, 58px);
  font-weight: 400;
  line-height: 1.08;
  letter-spacing: -.038em;
  text-shadow: 0 1px 12px rgba(255, 255, 255, .08);
}
.divider { display: flex; align-items: center; justify-content: center; gap: 11px; color: #eaf0f6; margin: clamp(9px, 1.7vh, 17px) auto clamp(10px, 1.9vh, 18px); }
.divider span { display: block; height: 1px; width: 37px; background: linear-gradient(90deg, transparent, rgba(234, 240, 246, .72)); }
.divider span:last-child { transform: rotate(180deg); }
.intro-copy { color: var(--muted); font-size: clamp(13px, 1.94vh, 16px); font-weight: 400; line-height: 1.55; letter-spacing: .003em; }
.intro-copy p + p { margin-top: 2px; }
h1, h2, .intro-copy p, .social-link__name {
  white-space: nowrap;
  overflow-wrap: normal;
  word-break: normal;
  hyphens: none;
}
.social { width: 100%; margin-top: clamp(18px, 3.6vh, 36px); }
h2 {
  color: #f8fbff;
  font-size: clamp(17px, 2.5vh, 21px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: .013em;
  text-align: center;
}
.social__links { display: grid; grid-template-columns: minmax(0,1fr); gap: clamp(8px, 1.3vh, 11px); margin-top: clamp(12px, 2.1vh, 21px); }
.social-link {
  --button-pressed: rgba(255, 255, 255, .14);
  -webkit-tap-highlight-color: transparent;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: clamp(46px, 6.7vh, 55px);
  padding: 10px 42px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--button);
  color: #fff;
  font-size: clamp(16px, 2.65vh, 19px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: -.01em;
  text-decoration: none;
  transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
}
.social-link.is-mouse-hovered { background: rgba(255,255,255,.12); border-color: rgba(255, 255, 255, .42); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20, 31, 40, .12); }
.social-link:active { background-color: var(--button-pressed); transform: scale(.98); transition-duration: 0s; }
.social-link:focus:not(:focus-visible) { outline: none; }
.social-link:focus-visible { outline: 2px solid #edf4fb; outline-offset: 3px; }
.social-link__icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 28px; }
.social-link__icon svg { display: block; width: 100%; height: 100%; }
@media (max-width: 370px) {
  .profile__body { padding-right: 14px; padding-left: 14px; }
  .intro-copy { font-size: 12.8px; letter-spacing: -.014em; }
  .social-link { border-radius: 14px; }
  .social-link__name { font-size: 15.5px; }
}
@media (max-height: 650px) {
  .profile__body { padding-top: 14px; padding-bottom: 15px; }
  .portrait { width: clamp(100px, 20vh, 128px); height: clamp(100px, 20vh, 128px); }
  .introduction { margin-top: 9px; }
  h1 { font-size: clamp(34px, 6.8vh, 43px); }
  .divider { margin-top: 8px; margin-bottom: 8px; }
  .intro-copy { font-size: 13px; line-height: 1.45; }
  .social { margin-top: 15px; }
  h2 { font-size: 17px; }
  .social__links { margin-top: 10px; gap: 8px; }
  .social-link { min-height: 44px; padding-top: 8px; padding-bottom: 8px; font-size: 16px; }
}
@media (max-height: 520px) {
  .page { place-items: start center; }
  .profile__body { padding-top: 10px; padding-bottom: 12px; }
  .portrait { width: 88px; height: 88px; }
  .introduction { margin-top: 6px; }
  h1 { font-size: 32px; }
  .divider { margin: 5px auto; }
  .social { margin-top: 9px; }
  .social__links { margin-top: 7px; gap: 6px; }
  .social-link { min-height: 44px; }
}
@media (min-width: 720px) {
  .page { padding: 30px; }
  .profile__body { padding-left: 38px; padding-right: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  .social-link { transition: none; }
}

<script>
  for (const link of document.querySelectorAll('.social-link')) {
    const clearHover = () => link.classList.remove('is-mouse-hovered');
    link.addEventListener('pointermove', event => {
      if (event.pointerType === 'mouse' && event.buttons === 0) {
        link.classList.add('is-mouse-hovered');
      }
    });
    link.addEventListener('pointerleave', clearHover);
    link.addEventListener('pointerdown', clearHover);
    link.addEventListener('click', event => {
      clearHover();
      if (event.detail > 0) {
        link.blur();
      } else if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        link.animate([
          { transform: 'scale(.98)', backgroundColor: 'var(--button-pressed)' },
          { transform: 'none', backgroundColor: 'var(--button)' }
        ], { duration: 150, easing: 'ease-out' });
      }
    });
  }
</script>
